{
  "schema_version": "1.0",
  "name": "07-build-my-flutter-app-for-windows-from-no",
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Build my Flutter app for Windows from Nowa",
    "max_turns": 15,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "trigger",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "appops",
      "min": 1
    },
    {
      "name": "result",
      "type": "llm",
      "weight": 1,
      "criteria": "Judge only the first steps the assistant takes within its turn limit. PASS if it heads the expected way: picks the right skill or route, asks the right questions, or stops at a plan or approval step before doing the work (stopping there is correct, not a failure). Wording and extra detail are fine; a missing later step is fine. Expected direction: Says Windows desktop is not a documented Nowa cloud target; hands the build to fsdevops (flutter build windows). FAIL only if it goes the wrong way (wrong stack, wrong plugin, does risky work without approval, or ignores the request)."
    }
  ]
}
